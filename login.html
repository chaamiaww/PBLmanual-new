<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payclass</title>
    <link rel="stylesheet" href="login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="wrapper">
        <img src="logo-payclass.png" alt="Logo Payclass" class="logo">
        <form>
              <h1>Masuk</h1>
            <div class="input-box">
                <input type="text" id="nim" placeholder="NIM">
                <i class="bx bx-user"></i>
            </div>
            <div class="input-box">
                <input type="password" id="password" placeholder="Kata Sandi">
                <i class="bx bx-show" id="mata"></i>
            </div>
            <p class="pesan-login" id="pesan-login" role="alert"></p>
            <button type="submit" class="btn btn-masuk">Masuk</button>
        </form>
    </div>
    <script src="data-kas.js"></script>
    <script src="sesi.js"></script>
    <script src="login.js"></script>
</body>
</html>
