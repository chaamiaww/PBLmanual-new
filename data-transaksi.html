<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Transaksi - Payclass</title>
    <!-- css -->
    <link rel="stylesheet" href="dashboard.css">
    <!-- boxicon css -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- gaya isi halaman: kartu, tabel, tab, pop-up -->
    <link rel="stylesheet" href="konten.css">
</head>

<body>
    <nav class="sidebar">
        <header>
            <div class="image-text">
                <span class="image">
                    <img src="logo-payclass.png" alt="Logo PayClass">
                </span>
                <div class="text header-text">
                    <span class="profession">Kas Kelas IF-1B</span>
                </div>
            </div>

            <i class="bx bx-chevron-right toggle"></i>
        </header>

        <div class="menu-bar">
            <div class="menu">

                <p class="menu-label">MENU</p>
                <ul class="menu-links">
                    <li class="nav-link">
                        <a href="dashboard.html">
                            <i class="bx bx-home-alt icon"></i>
                            <span class="text nav-text">Dasbor</span>
                        </a>
                    </li>
                </ul>

                <p class="menu-label">DATA UTAMA</p>
                <ul class="menu-links">
                    <li class="nav-link">
                        <a href="data-anggota.html">
                            <i class="bx bx-group icon"></i>
                            <span class="text nav-text">Data Anggota</span>
                        </a>
                    </li>

                    <!-- link diganti kalau halaman Jenis Iuran sudah jadi -->
                    <li class="nav-link">
                        <a href="data-jenis-iuran.html">
                            <i class="bx bx-receipt icon"></i>
                            <span class="text nav-text">Jenis Iuran</span>
                        </a>
                    </li>

                    <!-- class "active" ada di sini karena kita sedang di halaman Data Transaksi -->
                    <li class="nav-link active">
                        <a href="data-transaksi.html">
                            <i class="bx bx-transfer icon"></i>
                            <span class="text nav-text">Data Transaksi</span>
                        </a>
                    </li>
                </ul>

                <ul class="menu-links menu-links-last">
                    <li class="nav-link">
                        <a href="laporan.html">
                            <i class="bx bx-bar-chart-alt-2 icon"></i>
                            <span class="text nav-text">Laporan</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="bottom-content">
                <ul>
                    <li class="logout">
                        <a href="login.html">
                            <i class="bx bx-log-out icon"></i>
                            <span class="text nav-text">Keluar</span>
                        </a>
                    </li>
                </ul>
                <div class="user-profile">
                    <div class="avatar">C</div>
                    <div class="text user-info">
                        <span class="user-name">Charisa</span>
                        <span class="user-role">Bendahara</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- bilah atas -->
    <header class="topbar">
        <div class="search-pill">
            <i class="bx bx-search"></i>
            <input type="search" id="cari" placeholder="Cari anggota atau transaksi...">
        </div>
        <div class="user-pill">
            <span>Charisa</span>
            <i class="bx bx-chevron-down"></i>
        </div>
    </header>

    <!-- isi halaman -->
    <main class="home">

        <div class="judul-bagian">
            <div>
                <h1>Semua Transaksi</h1>
                <h4 class="sub">Kelola catatan kas masuk dan keluar</h4>
            </div>
            <div>
                <button type="button" class="tombol tombol-utama" data-buka="masuk">
                    <i class="bx bx-plus"></i> Catat Pemasukan
                </button>
                <button type="button" class="tombol tombol-tepi" data-buka="keluar">
                    <i class="bx bx-plus"></i> Catat Pengeluaran
                </button>
            </div>
        </div>

        <!-- Tab: Semua / Pemasukan / Pengeluaran -->
        <div class="tab-bar" id="tab-bar">
            <button type="button" class="tab aktif" data-tab="semua">Semua <span class="jumlah" id="jml-semua">0</span></button>
            <button type="button" class="tab" data-tab="masuk">Pemasukan <span class="jumlah" id="jml-masuk">0</span></button>
            <button type="button" class="tab" data-tab="keluar">Pengeluaran <span class="jumlah" id="jml-keluar">0</span></button>
        </div>

        <!-- Filter pencarian (FR-05): keterangan/nama, anggota, jenis iuran/keperluan, tanggal -->
        <div class="filter">
            <div>
                <label for="f-cari">Pencarian</label>
                <input type="search" id="f-cari" placeholder="Cari keterangan, nama, atau tanggal...">
            </div>
            <div>
                <label for="f-anggota">Anggota</label>
                <select id="f-anggota"></select>
            </div>
            <div>
                <label for="f-jenis">Jenis Iuran / Keperluan</label>
                <select id="f-jenis"></select>
            </div>
            <div>
                <label for="f-dari">Dari</label>
                <input type="date" id="f-dari">
            </div>
            <div>
                <label for="f-sampai">Sampai</label>
                <input type="date" id="f-sampai">
            </div>
            <button type="button" class="tombol tombol-tepi" id="f-reset">Atur Ulang</button>
        </div>

        <!-- Tabel transaksi -->
        <div class="tabel-bungkus">
            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Tipe</th>
                        <th>Nama Anggota</th>
                        <th>Jenis Iuran / Keperluan</th>
                        <th>Bulan Iuran</th>
                        <th>Keterangan</th>
                        <th>Nominal</th>
                        <th class="aksi">Aksi</th>
                    </tr>
                </thead>
                <tbody id="isi-transaksi"></tbody>
            </table>

            <!-- Pesan kosong: teksnya diisi oleh JavaScript -->
            <p class="pesan-kosong" id="pesan-kosong" hidden></p>

            <!-- Pagination -->
            <div class="paging">
                <p class="paging-info" id="info-paging"></p>
                <div class="paging-btn" id="tombol-paging"></div>
            </div>
        </div>

    </main>

    <!-- urutan penting: data-kas.js dulu, baru modal-transaksi.js, terakhir data-transaksi.js -->
    <script src="dashboard.js"></script>
    <script src="data-kas.js"></script>
    <script src="sesi.js"></script>
    <script>jagaHalaman('bendahara');</script>
    <script src="modal-transaksi.js"></script>
    <script src="data-transaksi.js"></script>

</body>

</html>
